name: Release Please

# On every push to main, release-please reads the conventional commit titles
# since the last release and keeps a release PR open with the next version
# and CHANGELOG entry. Merging that PR tags vX.Y.Z and publishes a GitHub
# Release. Config: release-please-config.json and .release-please-manifest.json.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
