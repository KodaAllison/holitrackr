name: PR Title

# PRs are squash-merged, so the PR title becomes the commit on main that
# release-please reads. This check keeps every title in conventional commit
# form (feat: ..., fix: ..., feat!: ... for breaking changes).
# pull_request_target is safe here: the job never checks out the PR's code.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
